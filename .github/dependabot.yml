version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    # QUALITY_BASELINE.md explains each pin.
    ignore:
      # Pinned to the engines.vscode minimum.
      - dependency-name: '@types/vscode'
      # Tracks the Node major of the minimum VS Code release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Mocha 12 is ESM-only and cannot load in the minimum release's extension host.
      - dependency-name: 'mocha'
        update-types: ['version-update:semver-major']
    groups:
      npm-development-minor-patch:
        dependency-type: 'development'
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:30'
      timezone: 'Etc/UTC'
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
