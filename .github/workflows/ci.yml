name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unused code check
        run: npm run lint:unused

      - name: Type check
        run: npm run typecheck

      - name: Unit + security tests with coverage
        run: npm run coverage

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: VS Code integration tests (minimum engine and stable)
        run: xvfb-run -a npm run test:integration

      - name: No-telemetry guard
        run: npm run check:no-telemetry

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build VSIX
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ github.sha }}
          path: '*.vsix'
          retention-days: 30
