name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unused code check
        run: npm run lint:unused

      - name: Type check
        run: npm run typecheck

      - name: Unit + security tests with coverage
        run: npm run coverage

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: VS Code integration tests (minimum engine and stable)
        run: xvfb-run -a npm run test:integration

      - name: No-telemetry guard
        run: npm run check:no-telemetry

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build and check VSIX
        run: npm run package

      - name: Packaged VSIX in Restricted Mode (minimum engine and stable)
        run: xvfb-run -a npm run test:packaged

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 30

  # Credentials and settings go through OS-specific storage, so the VS Code tests also run on
  # Windows and macOS. The checks above do not depend on the OS and run once.
  vscode-other-os:
    name: VS Code tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: VS Code integration tests (minimum engine and stable)
        run: npm run test:integration

      - name: Build and check VSIX
        run: npm run package

      - name: Packaged VSIX in Restricted Mode (minimum engine and stable)
        run: npm run test:packaged
