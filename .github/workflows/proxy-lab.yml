name: Proxy lab

# Runs the proxy lab probe (TESTING.md, "The probe") when started by hand. It never runs on pull
# requests, so it cannot become a required check: the lab needs Linux containers, which GitHub's
# macOS runners (no Docker) and Windows runners (no Linux containers) cannot run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: VS Code through the proxy lab
    runs-on: ubuntu-latest
    # The probe gives up on a stuck Remote-SSH window after 3 minutes, and up to 5 for the
    # two-window check, so stuck SSH checks on both versions can take 28 minutes on their own.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Start the proxy lab
        run: npm run proxy-lab:up

      - name: Probe VS Code through the lab (1.97.0 and stable)
        run: xvfb-run -a npm run proxy-lab:probe

      - name: Proxy logs
        if: always()
        run: npm run proxy-lab:logs

      - name: Stop the proxy lab
        if: always()
        run: npm run proxy-lab:down
