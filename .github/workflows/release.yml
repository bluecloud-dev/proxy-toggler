name: Release

# A version tag builds, tests, and publishes a GitHub release. A manual run is a rehearsal: it
# builds and tests the same way and keeps the files as a workflow artifact, but publishes nothing.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag names the package version
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "Tag $TAG_NAME does not match package.json version $version." >&2
            exit 1
          fi

      - name: Format, lint, unused code, types, unit tests
        run: npm run check

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: VS Code integration tests (minimum engine and stable)
        run: xvfb-run -a npm run test:integration

      - name: No-telemetry guard
        run: npm run check:no-telemetry

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build and check VSIX
        run: npm run package

      - name: Packaged VSIX in Restricted Mode (minimum engine and stable)
        run: xvfb-run -a npm run test:packaged

      - name: Record the VSIX checksum
        run: sha256sum proxy-toggler-*.vsix > SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          node <<'NODE'
          const fs = require('fs');

          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const headerRegex = new RegExp(`^## \\[${escapedVersion}\\].*$`, 'm');
          const headerIndex = changelog.search(headerRegex);
          if (headerIndex === -1) {
            throw new Error(`Could not find changelog section for version ${version}`);
          }

          const startIndex = changelog.indexOf('\n', headerIndex);
          if (startIndex === -1) throw new Error('Malformed changelog section header');

          const nextHeaderRegex = /^## \[[^\]]+\]/gm;
          nextHeaderRegex.lastIndex = startIndex + 1;
          const nextHeader = nextHeaderRegex.exec(changelog);
          const endIndex = nextHeader ? nextHeader.index : changelog.length;

          const body = changelog.slice(startIndex + 1, endIndex).trim();
          fs.writeFileSync('release-notes.md', `${body}\n`);
          NODE

      - name: Keep the tested files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            proxy-toggler-*.vsix
            SHA256SUMS
            release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    # A manual run started on a tag has ref_type 'tag' too, and must stay a rehearsal.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the tested files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      - name: Check that the VSIX is the one that was tested
        run: sha256sum --check SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG_NAME" proxy-toggler-*.vsix SHA256SUMS
          --repo "$REPOSITORY"
          --title "Proxy Toggler $TAG_NAME"
          --notes-file release-notes.md
          --verify-tag
