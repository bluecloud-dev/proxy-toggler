<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#2d2d44"/>
    </linearGradient>
    
    <!-- Knob gradient - green with 3D effect -->
    <linearGradient id="knobGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7be07b"/>
      <stop offset="50%" style="stop-color:#66bb6a"/>
      <stop offset="100%" style="stop-color:#4caf50"/>
    </linearGradient>
    
    <!-- Knob shadow -->
    <filter id="knobShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="840" height="300" fill="url(#bgGradient)"/>
  
  <!-- Decorative network nodes -->
  <g opacity="0.15">
    <!-- Connection lines -->
    <line x1="50" y1="60" x2="150" y2="120" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="150" y1="120" x2="100" y2="200" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="150" y1="120" x2="250" y2="80" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="700" y1="50" x2="780" y2="100" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="780" y1="100" x2="750" y2="180" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="780" y1="100" x2="820" y2="160" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="650" y1="220" x2="720" y2="260" stroke="#4fc3f7" stroke-width="1"/>
    
    <!-- Nodes -->
    <circle cx="50" cy="60" r="4" fill="#4fc3f7"/>
    <circle cx="150" cy="120" r="5" fill="#4fc3f7"/>
    <circle cx="100" cy="200" r="3" fill="#4fc3f7"/>
    <circle cx="250" cy="80" r="4" fill="#4fc3f7"/>
    <circle cx="700" cy="50" r="3" fill="#4fc3f7"/>
    <circle cx="780" cy="100" r="5" fill="#4fc3f7"/>
    <circle cx="750" cy="180" r="4" fill="#4fc3f7"/>
    <circle cx="820" cy="160" r="3" fill="#4fc3f7"/>
    <circle cx="650" cy="220" r="4" fill="#4fc3f7"/>
    <circle cx="720" cy="260" r="3" fill="#4fc3f7"/>
  </g>
  
  <!-- Main icon group - flat track, 3D knob -->
  <g transform="translate(380, 75)">
    <!-- Toggle track - flat original gray -->
    <rect x="0" y="0" width="80" height="56" rx="28" fill="#3a3a5c"/>
    
    <!-- Toggle knob - green with 3D effect and shadow -->
    <circle cx="52" cy="28" r="24" fill="url(#knobGradient)" filter="url(#knobShadow)"/>
    
    <!-- Globe symbol on knob - white -->
    <g transform="translate(52, 28)" stroke="#fff" fill="none">
      <!-- Outer circle -->
      <circle cx="0" cy="0" r="16" stroke-width="2.5"/>
      <!-- Vertical ellipse (longitude) -->
      <ellipse cx="0" cy="0" rx="5.5" ry="16" stroke-width="2"/>
      <!-- Horizontal line (equator) -->
      <line x1="-16" y1="0" x2="16" y2="0" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Extension name - VS Code font stack -->
  <text x="420" y="195" text-anchor="middle" font-family="'Droid Sans Mono', 'monospace', 'Courier New', Courier" font-size="36" font-weight="600" fill="#ffffff">
    Proxy Toggle
  </text>
  
  <!-- Tagline with bold ON and OFF -->
  <text x="420" y="232" text-anchor="middle" font-family="'Droid Sans Mono', 'monospace', 'Courier New', Courier" font-size="14" fill="#b8b8d0">
    <tspan>Quickly toggle VS Code proxy settings </tspan><tspan font-weight="bold">ON</tspan><tspan> and </tspan><tspan font-weight="bold">OFF</tspan>
  </text>
</svg>
