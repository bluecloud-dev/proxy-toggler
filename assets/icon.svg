<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Export the Marketplace PNG with:
       rsvg-convert -w 256 -h 256 assets/icon.svg -o assets/icon.png -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34365a"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <!-- Track gradient (green, on) -->
    <linearGradient id="trackOn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66bb6a"/>
      <stop offset="1" stop-color="#43a047"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background; the faint rim keeps its edge visible on dark themes -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)"
        stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Toggle switch track, on. Sized so the switch shape still reads at 16-32px -->
  <rect x="14" y="34" width="100" height="60" rx="30" fill="url(#trackOn)"/>

  <!-- Toggle knob, on position: track end-cap center is x = 114 - 30 = 84 -->
  <circle cx="84" cy="64" r="25" fill="#fff"/>

  <!-- Globe on the knob -->
  <g transform="translate(84, 64)" fill="none" stroke="#1e1e2e" stroke-width="3.75" stroke-linecap="round">
    <circle r="16"/>
    <ellipse rx="6.5" ry="16"/>
    <line x1="-16" x2="16"/>
  </g>
</svg>
