<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d44"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
    <!-- Toggle on gradient (green) -->
    <linearGradient id="toggleOn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#66bb6a"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Toggle switch track - centered (width 80, so x = (128-80)/2 = 24) -->
  <rect x="24" y="36" width="80" height="56" rx="28" fill="#3a3a5c"/>
  
  <!-- Toggle knob - on position (right side, 2px from edge) -->
  <!-- Track ends at x=104, knob radius 26, so knob center = 104 - 2 - 26 = 76 -->
  <circle cx="76" cy="64" r="26" fill="url(#toggleOn)"/>
  
  <!-- Simplified Network/Globe symbol - fills the knob -->
  <g transform="translate(76, 64)" stroke="#fff" fill="none">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="18" stroke-width="2.5"/>
    <!-- Vertical ellipse (longitude) -->
    <ellipse cx="0" cy="0" rx="6" ry="18" stroke-width="2"/>
    <!-- Horizontal line (equator) -->
    <line x1="-18" y1="0" x2="18" y2="0" stroke-width="2"/>
  </g>
</svg>
