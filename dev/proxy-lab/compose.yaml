# Proxy lab for testing Proxy Toggler, and VS Code itself, against real proxy software.
# See README.md. Every port is published on the host's 127.0.0.1 only.
name: proxy-toggler-lab

services:
  squid-open:
    image: ubuntu/squid:7.2-26.04_edge
    # The image runs Squid under Pebble; --args replaces the arguments of its "squid" service.
    command: ['--args', 'squid', '-f', '/etc/squid/lab/open.conf', '-NYC']
    environment:
      # Pebble passes the service output, where the entrypoint tails the access log, to the
      # container output only in verbose mode.
      PEBBLE_VERBOSE: '1'
    volumes:
      - ./squid:/etc/squid/lab:ro
    networks: [default, remote]
    ports:
      - '127.0.0.1:3128:3128'

  squid-auth:
    image: ubuntu/squid:7.2-26.04_edge
    entrypoint: ['sh', '/etc/squid/lab/auth-entrypoint.sh']
    command: ['--args', 'squid', '-f', '/etc/squid/lab/auth.conf', '-NYC']
    environment:
      PEBBLE_VERBOSE: '1'
    volumes:
      - ./squid:/etc/squid/lab:ro
    networks: [default, remote]
    ports:
      - '127.0.0.1:3129:3128'

  # Intercepts TLS with a certificate authority that mitmproxy generates on first start and that
  # no client trusts.
  mitmproxy:
    image: mitmproxy/mitmproxy:12.2.3
    command: ['mitmdump', '--mode', 'regular@8080']
    environment:
      # Without a terminal Python buffers its output, which would delay `docker compose logs`.
      PYTHONUNBUFFERED: '1'
    networks: [default, remote]
    ports:
      - '127.0.0.1:8080:8080'

  # A plain SOCKS5 relay: --ignore-hosts passes every connection through untouched.
  socks5:
    image: mitmproxy/mitmproxy:12.2.3
    command: ['mitmdump', '--mode', 'socks5@1080', '--ignore-hosts', '.*']
    environment:
      PYTHONUNBUFFERED: '1'
    networks: [default, remote]
    ports:
      - '127.0.0.1:1080:1080'

  pac:
    image: nginx:1.31.7-alpine
    volumes:
      - ./pac/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pac/proxy.pac:/usr/share/nginx/pac/proxy.pac:ro
    ports:
      - '127.0.0.1:8000:8000'

  origin:
    # The Debian image, unlike the Alpine one, ships openssl to generate the certificate.
    image: nginx:1.31.7
    entrypoint: ['sh', '/etc/nginx/lab/entrypoint.sh']
    command: ['nginx', '-g', 'daemon off;']
    volumes:
      - ./origin/entrypoint.sh:/etc/nginx/lab/entrypoint.sh:ro
      - ./origin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        # Resolves only inside this network, so a client on the host reaches it through a proxy.
        aliases: [origin.lab.test]
    ports:
      - '127.0.0.1:8088:8088'
      - '127.0.0.1:8443:8443'

  # The remote side of a VS Code remote window, for Remote-SSH. It sits on the remote network only:
  # it reaches the proxies by service name (http://squid-open:3128), but origin.lab.test does not
  # resolve there, so a reply from the origin proves that a remote request went through a proxy.
  ssh-host:
    build: ./ssh
    # The probe kills the VS Code server between checks, and sshd does not reap orphans.
    init: true
    entrypoint: ['sh', '/etc/ssh/lab/entrypoint.sh']
    volumes:
      - ./ssh/entrypoint.sh:/etc/ssh/lab/entrypoint.sh:ro
      - ./ssh/sshd.conf:/etc/ssh/sshd_config.d/lab.conf:ro
    networks: [remote]
    ports:
      - '127.0.0.1:2222:22'
    # proxy-lab:up waits for this, so a client can connect as soon as it returns.
    healthcheck:
      test: ['CMD', 'pgrep', '-x', 'sshd']
      interval: 2s

networks:
  default: {}
  # Not internal: the SSH host downloads the VS Code server from the internet.
  remote: {}
