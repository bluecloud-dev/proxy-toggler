# The lab origin: plain HTTP on 8088 and TLS on 8443 with the self-signed certificate that
# entrypoint.sh generates. The reply names the address the request came from, which shows whether
# it went through a lab proxy.
server {
    listen 8088;
    listen 8443 ssl;

    ssl_certificate /run/origin-tls/origin.crt;
    ssl_certificate_key /run/origin-tls/origin.key;

    location / {
        default_type text/plain;
        return 200 "Proxy Toggler lab origin: $scheme://$host:$server_port$request_uri from $remote_addr\n";
    }
}
