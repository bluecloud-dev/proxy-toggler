# Serves proxy.pac on http://127.0.0.1:8000/proxy.pac. The access log goes to the container
# output, so `docker compose logs pac` shows when a client fetched the file.
server {
    listen 8000;

    location = /proxy.pac {
        root /usr/share/nginx/pac;
        types { }
        default_type application/x-ns-proxy-autoconfig;
        # Edits to proxy.pac take effect on the client's next fetch.
        add_header Cache-Control no-store;
    }

    location / {
        return 404;
    }
}
