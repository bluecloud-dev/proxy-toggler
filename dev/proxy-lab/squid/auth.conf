# squid-auth: a forward proxy that asks for Basic credentials. auth-entrypoint.sh writes the
# password file when the container starts.

include /etc/squid/lab/common.conf

auth_param basic program /usr/lib/squid/basic_ncsa_auth /run/squid-lab-passwd
auth_param basic realm Proxy Toggler lab
acl lab_user proxy_auth REQUIRED

http_access deny !localnet
http_access allow lab_user
http_access deny all
