# sshd settings for the lab SSH host, read before Debian's own /etc/ssh/sshd_config. Only the key
# that entrypoint.sh generates logs in, and only as the lab account.
AllowUsers lab
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no

# Remote-SSH reaches the VS Code server through a forwarded port or socket.
AllowTcpForwarding yes
AllowStreamLocalForwarding yes
